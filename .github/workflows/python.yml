name: Python SDK
on: [push, pull_request]
jobs:
  test-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ./python
      - run: python -c "from oyyo import OYYO; assert OYYO().base_url"
